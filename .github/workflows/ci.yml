name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: "[${{ matrix.os }} / node ${{ matrix.node }}] Bundle externals and manifest surface"
        run: node scripts/check-bundle.mjs
      - name: "[${{ matrix.os }} / node ${{ matrix.node }}] Static dist consistency (src/d.ts exports, signatures, runtime exports, no source maps, provenance)"
        run: node scripts/verify-dist.mjs
      - name: "[${{ matrix.os }} / node ${{ matrix.node }}] Verification tooling regression tests"
        run: node scripts/test-regressions.mjs
      - name: "[${{ matrix.os }} / node ${{ matrix.node }}] Ponytail core behavior invariants"
        run: node scripts/test-core.mjs
      - name: Install isolated UI test dependencies
        run: npm install --prefix "${{ runner.temp }}/ponytail-ui-tools" --ignore-scripts --no-audit --no-fund react@18.3.1 react-dom@18.3.1 jsdom@26.1.0 @deepseek-ai/cordis@4.0.4
      - name: "[${{ matrix.os }} / node ${{ matrix.node }}] Shipped browser UI interactions"
        env:
          PONYTAIL_TOOL_ROOT: ${{ runner.temp }}/ponytail-ui-tools
        run: node scripts/test-ui.mjs
      - name: "[${{ matrix.os }} / node ${{ matrix.node }}] Pack verification (installed smoke, real Cordis and V4 notice admission)"
        run: node scripts/verify-pack.mjs
      - name: "[${{ matrix.os }} / node ${{ matrix.node }}] Default pnpm peer installation regression"
        run: node scripts/test-install.mjs
      - name: "[${{ matrix.os }} / node ${{ matrix.node }}] Static guard: no version-pinned latest release links"
        run: node scripts/check-release-links.mjs
      - name: "[${{ matrix.os }} / node ${{ matrix.node }}] Release consistency script offline sanity"
        run: node scripts/check-release-consistency.mjs --offline
      - name: Release publication retry regression tests
        run: node scripts/test-release-retry.mjs
      - name: "[${{ matrix.os }} / node ${{ matrix.node }}] TypeScript consumer test (NodeNext, skipLibCheck:false, packed tarball)"
        run: node scripts/test-consumer.mjs

  host-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dsh: ['0.1.1-rc.2', '0.1.2-rc.1', '0.1.5-rc.3', '0.1.7-rc.2', '0.2.0-rc.2', '0.2.1-rc.2']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install isolated browser tooling
        run: npm install --prefix "${{ runner.temp }}/ponytail-host-ui-tools" --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Install browser
        run: node "${{ runner.temp }}/ponytail-host-ui-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Real DSH panel, save, restart and reset
        env:
          TMPDIR: ${{ runner.temp }}
          PONYTAIL_TOOL_ROOT: ${{ runner.temp }}/ponytail-host-ui-tools
          PONYTAIL_VERIFY_KEEP_TEMP: '1'
        run: node scripts/test-host-ui.mjs ${{ matrix.dsh }}
      - name: Retain real-browser evidence, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ponytail-ui-dsh-${{ matrix.dsh }}
          path: ${{ runner.temp }}/ponytail-host-ui-${{ matrix.dsh }}-*/evidence
          if-no-files-found: warn
          retention-days: 14

  persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Real DSH 0.2.0-rc.2 V4 persistence and restart regression
        env:
          TMPDIR: ${{ runner.temp }}
          PONYTAIL_VERIFY_KEEP_TEMP: '1'
        run: node scripts/test-persistence.mjs
      - name: Retain persistence evidence, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ponytail-v4-persistence
          path: ${{ runner.temp }}/ponytail-persistence-*/evidence
          if-no-files-found: warn
          retention-days: 14
