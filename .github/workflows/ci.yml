name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Built bundle and manifest load
        run: |
          node --input-type=module -e "await import('./lib/index.js'); await import('./lib/invariant.js'); console.log('lib loads')"
          node -e "const p=require('./package.json'); if (!p.dsh?.bundle?.patch) throw new Error('dsh.bundle.patch missing'); console.log('manifest ok')"
      - name: Packed tarball contains the installable pieces
        run: |
          npm pack --pack-destination "$RUNNER_TEMP" >/dev/null
          tar -tzf "$RUNNER_TEMP"/mengyuil-dsh-ponytail-*.tgz | grep -qE 'package/(lib/index.js|cordis.patch.yml)' && echo 'tarball ok'
