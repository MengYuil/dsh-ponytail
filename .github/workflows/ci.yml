name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Committed artifacts must be clean (no drift in lib/)
        run: git diff --exit-code -- lib
      - name: Bundle must not leave dsh core external (self-contained install)
        run: |
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('lib/index.js', 'utf8');
            const externals = [...src.matchAll(/from \"@([^\"]+)\"/g)].map(m => m[1]);
            const bad = externals.filter(x => x.startsWith('deepseek-ai/dsh-'));
            if (bad.length) throw new Error('bundle still imports dsh core at runtime: ' + bad.join(', '));
            console.log('externals:', externals.length ? externals.join(', ') : '(none)');
          "
      - name: Manifest declares the bundle patch
        run: |
          node -e "const p=require('./package.json'); if (!p.dsh?.bundle?.patch) throw new Error('dsh.bundle.patch missing'); console.log('manifest ok')"
      - name: Dist consistency (declarations, src↔d.ts drift, runtime exports, source maps)
        run: npm run verify:dist
      - name: Pack verification (tarball contents, version match, installed smoke)
        run: npm run verify:pack
      - name: TypeScript consumer test (NodeNext, skipLibCheck:false, packed tarball)
        run: npm run test:consumer
