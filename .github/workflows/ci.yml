name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bundle must not leave dsh core external (self-contained install)
        run: |
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('lib/index.js', 'utf8');
            const externals = [...src.matchAll(/from \"@([^\"]+)\"/g)].map(m => m[1]);
            const bad = externals.filter(x => x.startsWith('deepseek-ai/dsh-'));
            if (bad.length) throw new Error('bundle still imports dsh core at runtime: ' + bad.join(', '));
            console.log('externals:', externals.length ? externals.join(', ') : '(none)');
          "
      - name: Built bundle loads with only cordis installed (plugin shape)
        run: |
          npm i --no-save --no-audit --no-fund @deepseek-ai/cordis@"^4.0.1" >/dev/null 2>&1
          node --input-type=module -e "
            const m = await import('./lib/index.js');
            await import('./lib/invariant.js');
            if (m.name !== 'ponytail' || typeof m.apply !== 'function') throw new Error('bad plugin shape');
            console.log('lib loads; plugin shape ok');
          "
      - name: Manifest declares the bundle patch
        run: |
          node -e "const p=require('./package.json'); if (!p.dsh?.bundle?.patch) throw new Error('dsh.bundle.patch missing'); console.log('manifest ok')"
      - name: Packed tarball contains the installable pieces
        run: |
          npm pack --pack-destination "$RUNNER_TEMP" >/dev/null
          tar -tzf "$RUNNER_TEMP"/mengyuly-dsh-ponytail-*.tgz | grep -qE 'package/(lib/index.js|cordis.patch.yml)' && echo 'tarball ok'
