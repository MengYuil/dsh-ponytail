name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: "[${{ matrix.os }}] Bundle must not leave dsh core external (self-contained install)"
        run: |
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('lib/index.js', 'utf8');
            const externals = [...src.matchAll(/from \"@([^\"]+)\"/g)].map(m => m[1]);
            const bad = externals.filter(x => x.startsWith('deepseek-ai/dsh-'));
            if (bad.length) throw new Error('bundle still imports dsh core at runtime: ' + bad.join(', '));
            console.log('externals:', externals.length ? externals.join(', ') : '(none)');
          "
      - name: "[${{ matrix.os }}] Manifest declares the bundle patch"
        run: |
          node -e "const p=require('./package.json'); if (!p.dsh?.bundle?.patch) throw new Error('dsh.bundle.patch missing'); console.log('manifest ok')"
      - name: "[${{ matrix.os }}] Static dist consistency (src/d.ts exports, signatures, runtime exports, no source maps, provenance)"
        run: npm run verify:dist
      - name: "[${{ matrix.os }}] Verification tooling regression tests"
        run: npm run test:regressions
      - name: "[${{ matrix.os }}] Pack verification (tarball contents, version match, installed smoke)"
        run: npm run verify:pack
      - name: "[${{ matrix.os }}] TypeScript consumer test (NodeNext, skipLibCheck:false, packed tarball)"
        run: npm run test:consumer
