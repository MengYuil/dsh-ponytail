name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: "[${{ matrix.os }} / node ${{ matrix.node }}] Bundle externals and manifest surface"
        run: node scripts/check-bundle.mjs
      - name: "[${{ matrix.os }} / node ${{ matrix.node }}] Static dist consistency (src/d.ts exports, signatures, runtime exports, no source maps, provenance)"
        run: node scripts/verify-dist.mjs
      - name: "[${{ matrix.os }} / node ${{ matrix.node }}] Verification tooling regression tests"
        run: node scripts/test-regressions.mjs
      - name: "[${{ matrix.os }} / node ${{ matrix.node }}] Ponytail core behavior invariants"
        run: node scripts/test-core.mjs
      - name: Install isolated UI test dependencies
        run: npm install --prefix "${{ runner.temp }}/ponytail-ui-tools" --ignore-scripts --no-audit --no-fund react@18.3.1 react-dom@18.3.1 jsdom@26.1.0
      - name: "[${{ matrix.os }} / node ${{ matrix.node }}] Shipped browser UI interactions"
        env:
          PONYTAIL_TOOL_ROOT: ${{ runner.temp }}/ponytail-ui-tools
        run: node scripts/test-ui.mjs
      - name: "[${{ matrix.os }} / node ${{ matrix.node }}] Pack verification (tarball contents, version match, installed smoke)"
        run: node scripts/verify-pack.mjs
      - name: "[${{ matrix.os }} / node ${{ matrix.node }}] Default pnpm peer installation regression"
        run: node scripts/test-install.mjs
      - name: "[${{ matrix.os }} / node ${{ matrix.node }}] Static guard: no version-pinned latest release links"
        run: node scripts/check-release-links.mjs
      - name: "[${{ matrix.os }} / node ${{ matrix.node }}] Release consistency script offline sanity"
        run: node scripts/check-release-consistency.mjs --offline
      - name: Release publication retry regression tests
        run: node scripts/test-release-retry.mjs
      - name: "[${{ matrix.os }} / node ${{ matrix.node }}] TypeScript consumer test (NodeNext, skipLibCheck:false, packed tarball)"
        run: node scripts/test-consumer.mjs
