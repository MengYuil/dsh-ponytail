name: release-consistency
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published version to verify (e.g. 0.3.2)'
        required: true
        type: string
  release:
    types: [published]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Cross-channel release consistency (git tag, npm, GitHub assets, provenance)
        run: node scripts/check-release-consistency.mjs --version "${{ steps.version.outputs.version }}"
      - name: Fail loudly on remote unavailability
        if: failure()
        run: echo "::error::release consistency check failed or remote check was unavailable — investigate before relying on this release"
